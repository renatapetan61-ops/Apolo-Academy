name: Android Release APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-release.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Validate release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.APOLO_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.APOLO_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.APOLO_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.APOLO_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required release signing secret: $name"
              exit 1
            fi
          done
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.APOLO_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/apolo-release.jks"
          test -s "$RUNNER_TEMP/apolo-release.jks"
          echo "APOLO_RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/apolo-release.jks" >> "$GITHUB_ENV"
      - name: Build signed Release APK
        env:
          APOLO_RELEASE_STORE_PASSWORD: ${{ secrets.APOLO_RELEASE_STORE_PASSWORD }}
          APOLO_RELEASE_KEY_ALIAS: ${{ secrets.APOLO_RELEASE_KEY_ALIAS }}
          APOLO_RELEASE_KEY_PASSWORD: ${{ secrets.APOLO_RELEASE_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease
      - name: Verify APK signature, alignment and identity
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs "$APK"
          $ANDROID_HOME/build-tools/35.0.0/zipalign -c -v 4 "$APK"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          echo "APK SHA-256:"
          sha256sum "$APK"
          echo "AAB SHA-256:"
          sha256sum "$AAB"
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Apolo-Academy-v1.1.0
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.1.0 \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/bundle/release/app-release.aab \
            --title "Apolo Academy v1.1.0" \
            --notes "Nova jornada de aprendizado com 164 aulas de desenho em português: 45 básicas, 54 intermediárias e 65 avançadas. Inclui trilhas progressivas, exercícios, desafios, XP, sequência de estudos e progresso salvo no dispositivo. Tutoriais de referência abrem nos canais dos criadores brasileiros." \
            --latest
