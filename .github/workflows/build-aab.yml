name: Build Apolo Academy Release

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-aab.yml'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.APOLO_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing GitHub secret APOLO_RELEASE_KEYSTORE_BASE64."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/apolo-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/apolo-signing/apolo-release.jks"
          test -s "$RUNNER_TEMP/apolo-signing/apolo-release.jks"

      - name: Build signed APK and Android App Bundle
        env:
          APOLO_RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/apolo-signing/apolo-release.jks
          APOLO_RELEASE_STORE_PASSWORD: ${{ secrets.APOLO_RELEASE_STORE_PASSWORD }}
          APOLO_RELEASE_KEY_ALIAS: ${{ secrets.APOLO_RELEASE_KEY_ALIAS }}
          APOLO_RELEASE_KEY_PASSWORD: ${{ secrets.APOLO_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$APOLO_RELEASE_STORE_PASSWORD" || (echo "::error::Missing APOLO_RELEASE_STORE_PASSWORD" && exit 1)
          test -n "$APOLO_RELEASE_KEY_ALIAS" || (echo "::error::Missing APOLO_RELEASE_KEY_ALIAS" && exit 1)
          test -n "$APOLO_RELEASE_KEY_PASSWORD" || (echo "::error::Missing APOLO_RELEASE_KEY_PASSWORD" && exit 1)
          gradle assembleRelease bundleRelease --no-daemon

      - name: Upload APK and AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apolo-academy-release-files
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.0 \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/bundle/release/app-release.aab \
            --title "Apolo Academy v1.0.0" \
            --notes "Primeira versão pública do Apolo Academy. APK para instalação direta e AAB para distribuição em lojas compatíveis." \
            --latest
